<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SOC Mission Board — Teacher Home</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf0}
#site{width:100%;height:100%;border:0;display:block}
.loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#fffaf0;color:#15527d;font:800 20px/1.4 system-ui,sans-serif}
.loading.hidden{display:none}
</style>
</head>
<body>
<div id="loading" class="loading">Membuka SOC Mission Board Teacher...</div>
<iframe id="site" title="SOC Mission Board Teacher Home" src="about:blank"></iframe>
<script type="module">
import {auth,TEACHER_UID,logout} from './firebase-core.js';

const frame=document.getElementById('site');
const loading=document.getElementById('loading');
let currentMode='teacher';

function showPage(d,id){
  d.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const target=d.querySelector(id);
  if(target)target.classList.add('active');
  d.defaultView?.scrollTo?.(0,0);
}

function ensurePhoneControl(d){
  let page=d.querySelector('#page-phone-control');
  if(page)return page;
  const main=d.querySelector('main');
  if(!main)return null;
  page=d.createElement('section');
  page.id='page-phone-control';
  page.className='page';
  page.style.cssText='padding:0!important;max-width:none!important;width:100%!important;';
  page.innerHTML=`<div style="padding:20px 24px 8px"><div class="eyebrow">MODE HP SISWA</div><h2 style="margin:4px 0 8px">Teacher Mission Control</h2><p class="muted" style="margin:0 0 12px">Kelompok menjawab melalui HP. Teacher Setup, Pre-Test, Post-Test, Mission Progress, dan Evaluation tetap tersedia pada menu atas.</p></div><iframe id="integratedTeacherControl" title="Teacher Mission Control" src="teacher-control.html?v=20261003-integrated1" style="display:block;width:100%;height:calc(100vh - 210px);min-height:700px;border:0;background:#eef8fd"></iframe>`;
  main.appendChild(page);
  const controlFrame=page.querySelector('#integratedTeacherControl');
  controlFrame.addEventListener('load',()=>{
    try{
      const cd=controlFrame.contentDocument;
      const top=cd?.querySelector('.topbar');
      if(top)top.style.display='none';
      const mainEl=cd?.querySelector('main');
      if(mainEl){mainEl.style.paddingTop='18px';mainEl.style.maxWidth='none';}
    }catch(e){console.warn(e);}
  });
  return page;
}

function setModeButtons(d){
  const guru=d.querySelector('#integratedModeGuru');
  const hp=d.querySelector('#integratedModeHp');
  if(guru){
    guru.style.background=currentMode==='teacher'?'#1799d0':'#fff';
    guru.style.color=currentMode==='teacher'?'#fff':'#174f78';
  }
  if(hp){
    hp.style.background=currentMode==='phone'?'#0f5b86':'#fff';
    hp.style.color=currentMode==='phone'?'#fff':'#174f78';
  }
}

function openTeacherBoard(d){
  currentMode='teacher';
  setModeButtons(d);
  const boardBtn=d.querySelector('#nav button[data-go="board"]');
  if(boardBtn){boardBtn.click();return;}
  showPage(d,'#page-board');
}

function openPhoneControl(d){
  currentMode='phone';
  setModeButtons(d);
  ensurePhoneControl(d);
  showPage(d,'#page-phone-control');
}

function decorateTeacherHome(){
  try{
    const d=frame.contentDocument;
    if(!d || !d.body)return false;

    const nav=d.querySelector('#nav');
    if(nav && !d.querySelector('#integratedModeGuru')){
      const guru=d.createElement('button');
      guru.id='integratedModeGuru';
      guru.textContent='🖥️ Mode Guru';
      guru.title='Guru mengisi dan mengunci jawaban kelompok dari laptop';
      guru.style.cssText='font-weight:900;border:2px solid #1799d0;';
      guru.onclick=()=>openTeacherBoard(d);

      const hp=d.createElement('button');
      hp.id='integratedModeHp';
      hp.textContent='📱 Mode HP';
      hp.title='Kelompok menjawab dari HP, guru memakai Mission Control';
      hp.style.cssText='font-weight:900;border:2px solid #0f5b86;';
      hp.onclick=()=>openPhoneControl(d);

      nav.insertBefore(hp,nav.firstChild);
      nav.insertBefore(guru,nav.firstChild);

      const out=d.createElement('button');
      out.id='teacherLogoutNav';
      out.textContent='Logout';
      out.onclick=async()=>{await logout();window.location.replace('teacher.html');};
      nav.appendChild(out);

      const boardBtn=nav.querySelector('button[data-go="board"]');
      if(boardBtn){
        boardBtn.addEventListener('click',e=>{
          if(currentMode==='phone'){
            e.preventDefault();
            e.stopImmediatePropagation();
            openPhoneControl(d);
          }
        },true);
      }
    }

    ensurePhoneControl(d);
    setModeButtons(d);

    const start=d.querySelector('#startGameBtn');
    if(start && !start.dataset.teacherIntegrated){
      start.dataset.teacherIntegrated='1';
      start.textContent='🚀 Mulai Permainan';
      start.addEventListener('click',e=>{
        if(currentMode==='phone'){
          e.preventDefault();
          e.stopImmediatePropagation();
          openPhoneControl(d);
        }
      },true);
    }

    loading.classList.add('hidden');
    return true;
  }catch(err){
    console.error(err);
    loading.textContent='Gagal membuka Teacher Home. Silakan refresh halaman.';
    return false;
  }
}

frame.addEventListener('load',()=>{
  if(frame.src==='about:blank')return;
  decorateTeacherHome();
});

if(typeof auth.authStateReady==='function') await auth.authStateReady();
if(!auth.currentUser || auth.currentUser.uid!==TEACHER_UID){
  location.replace('teacher.html');
}else{
  frame.src='index.html?v=20261003-integrated1';
}

setTimeout(()=>{if(!loading.classList.contains('hidden'))decorateTeacherHome();},2500);
</script>
</body>
</html>
