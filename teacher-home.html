<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SOC Mission Board — Teacher Home</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf0}#site{width:100%;height:100%;border:0;display:block}.loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#fffaf0;color:#15527d;font:800 20px/1.4 system-ui,sans-serif}.loading.hidden{display:none}
.mode-dock{position:fixed;z-index:80;right:22px;bottom:22px;width:min(470px,calc(100vw - 44px));padding:15px 16px;border:1px solid #cfe4ef;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 14px 40px rgba(15,77,112,.18);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#174f78;display:none}.mode-dock.show{display:block}.mode-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.mode-head b{font-size:16px}.mode-head small{color:#6c8aa0;font-weight:700}.mode-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode-btn{border:0;border-radius:15px;padding:13px 12px;font-weight:900;font-size:14px;cursor:pointer}.mode-teacher{background:#138dcc;color:#fff}.mode-phone{background:#0f5b86;color:#fff}.mode-note{margin-top:9px;color:#6c8aa0;font-size:12.5px;line-height:1.4}.mode-close{border:0;background:#eef6fa;color:#174f78;border-radius:10px;width:30px;height:30px;font-weight:900;cursor:pointer}@media(max-width:650px){.mode-actions{grid-template-columns:1fr}.mode-dock{right:12px;bottom:12px;width:calc(100vw - 24px);box-sizing:border-box}}
</style>
</head>
<body>
<div id="loading" class="loading">Membuka SOC Mission Board Teacher...</div>
<iframe id="site" title="SOC Mission Board Teacher Home" src="about:blank"></iframe>
<div id="modeDock" class="mode-dock" aria-label="Pilihan mode permainan">
  <div class="mode-head"><div><b>🎮 Pilih Mode Permainan</b><br><small>Guru dapat memakai salah satu dari dua cara.</small></div><button id="modeClose" class="mode-close" title="Tutup">×</button></div>
  <div class="mode-actions">
    <button id="teacherModeBtn" class="mode-btn mode-teacher">🖥️ MODE GURU<br><span style="font-size:11px;font-weight:700">Input & Lock dari laptop</span></button>
    <button id="phoneModeBtn" class="mode-btn mode-phone">📱 MODE HP SISWA<br><span style="font-size:11px;font-weight:700">Teacher Mission Control</span></button>
  </div>
  <div class="mode-note"><b>Mode Guru:</b> guru memasukkan jawaban 6 kelompok dan mengunci jawaban dari laptop. <b>Mode HP Siswa:</b> kelompok menjawab dari HP masing-masing, guru mengontrol sesi secara realtime.</div>
</div>
<script type="module">
import {auth,TEACHER_UID,logout} from './firebase-core.js';

const frame=document.getElementById('site');
const loading=document.getElementById('loading');
const dock=document.getElementById('modeDock');
const teacherModeBtn=document.getElementById('teacherModeBtn');
const phoneModeBtn=document.getElementById('phoneModeBtn');
const modeClose=document.getElementById('modeClose');

function decorateTeacherHome(){
  try{
    const d=frame.contentDocument;
    if(!d || !d.body)return false;
    const nav=d.querySelector('#nav');
    if(nav && !d.querySelector('#teacherMissionControlNav')){
      const control=d.createElement('button');
      control.id='teacherMissionControlNav';
      control.textContent='Teacher Mission Control';
      control.style.background='#0f5b86';
      control.style.color='#fff';
      control.onclick=()=>{window.location.href='teacher-control.html';};
      nav.appendChild(control);
      const out=d.createElement('button');
      out.id='teacherLogoutNav';
      out.textContent='Logout';
      out.onclick=async()=>{await logout();window.location.replace('teacher.html');};
      nav.appendChild(out);
    }
    const start=d.querySelector('#startGameBtn');
    if(start){
      start.textContent='🖥️ Mulai Mode Guru';
      start.title='Guru menjadi operator: input dan lock jawaban kelompok dari laptop.';
    }
    loading.classList.add('hidden');
    dock.classList.add('show');
    return true;
  }catch(err){
    console.error(err);
    loading.textContent='Gagal membuka Teacher Home. Silakan refresh halaman.';
    return false;
  }
}

frame.addEventListener('load',()=>{
  if(frame.src==='about:blank')return;
  decorateTeacherHome();
});

if(typeof auth.authStateReady==='function') await auth.authStateReady();
if(!auth.currentUser || auth.currentUser.uid!==TEACHER_UID){
  location.replace('teacher.html');
}else{
  frame.src='index.html?v=20261003-teacher3';
}

teacherModeBtn.onclick=()=>{
  dock.classList.remove('show');
  try{
    const start=frame.contentDocument?.querySelector('#startGameBtn');
    if(start){start.click();return;}
  }catch{}
  frame.src='index.html?v=20261003-teacher3';
};
phoneModeBtn.onclick=()=>{window.location.href='teacher-control.html';};
modeClose.onclick=()=>dock.classList.remove('show');

setTimeout(()=>{if(!loading.classList.contains('hidden'))decorateTeacherHome();},2500);
</script>
</body>
</html>
