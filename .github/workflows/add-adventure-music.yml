name: Add adventure music
on:
  push:
    paths:
      - 'adventure-music.js'
      - '.github/workflows/add-adventure-music.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add music controller to teacher and team pages
        run: |
          python - <<'PY'
          from pathlib import Path
          tag='<script src="adventure-music.js?v=20261003-adventure1"></script>'
          for name in ['teacher-home.html','team.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'adventure-music.js' not in s:
                  s=s.replace('</body>', tag+'\n</body>')
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-home.html team.html
          git commit -m "Enable adventure music in teacher and team modes"
          git push
