name: Wire shared Teacher Setup

on:
  push:
    paths:
      - '.github/workflows/wire-shared-config.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared config modules to teacher pages
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<script src="enhancements.js?v=5"></script>'
          new = old + '\n<script type="module" src="shared-config-sync.js?v=20261003-shared1"></script>'
          if 'shared-config-sync.js' not in s:
              if old not in s:
                  raise SystemExit('index script marker not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          p = Path('teacher-control.html')
          s = p.read_text(encoding='utf-8')
          old = '<script type="module" src="reveal-feedback-addon.js?v=20261003-8"></script>'
          new = old + '\n<script type="module" src="shared-multiplayer-config-addon.js?v=20261003-shared1"></script>'
          if 'shared-multiplayer-config-addon.js' not in s:
              if old not in s:
                  raise SystemExit('teacher-control script marker not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html teacher-control.html
          git commit -m "Integrate Teacher Setup across laptop and HP modes" || exit 0
          git push
