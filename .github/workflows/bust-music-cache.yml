name: Refresh adventure music cache
on:
  push:
    paths:
      - '.github/workflows/bust-music-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update music script version
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['teacher-home.html','team.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'adventure-music\.js\?v=[^"\']+', 'adventure-music.js?v=20261003-music3', s)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-home.html team.html
          git commit -m "Refresh adventure music script version"
          git push
