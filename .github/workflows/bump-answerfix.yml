name: Bump integrated answer fix
on:
  push:
    paths:
      - '.github/workflows/bump-answerfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh integrated Teacher Mission Control URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('teacher-home.html')
          s=p.read_text()
          s=s.replace('teacher-control.html?v=20261003-integrated2','teacher-control.html?v=20261004-answerfix1')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-home.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh integrated Teacher Mission Control answer fix"
          git push
