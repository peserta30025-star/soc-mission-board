name: Bump integrated checkpoint fix
on:
  push:
    paths:
      - '.github/workflows/bump-answerfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh authoritative checkpoint scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('teacher-home.html')
          s=p.read_text()
          s=re.sub(r'teacher-control\.html\?v=[A-Za-z0-9._-]+','teacher-control.html?v=20261005-movementfix4',s)
          p.write_text(s)

          p=Path('teacher-control.html')
          s=p.read_text()
          for name in [
              'teacher-app.js',
              'teacher-checkpoint-flow-v2.js',
              'correctness-repair-addon.js',
              'checkpoint-correctness-fix.js',
              'reveal-feedback-addon.js'
          ]:
              s=re.sub(re.escape(name)+r'\?v=[A-Za-z0-9._-]+',name+'?v=20261005-movementfix4',s)
          p.write_text(s)

          p=Path('team.html')
          s=p.read_text()
          for name in ['team-app.js','reveal-feedback-addon.js','team-checkpoint-addon.js']:
              s=re.sub(re.escape(name)+r'\?v=[A-Za-z0-9._-]+',name+'?v=20261005-teamcheckpoint2',s)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-home.html teacher-control.html team.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh authoritative checkpoint movement v4"
          git push
